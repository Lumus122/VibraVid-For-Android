name: Publish Android 2.8.0
on:
  push:
    branches: [main]
    paths: ['.github/release-2.8.0/**']
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Publish Android 2.8.0 release assets'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and publish signed local packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir package
          cd package
          for file in VibraVid_Studio_Android.apk VibraVid_Android_sorgenti.zip VibraVid_Studio_Android.apk.sha256 VibraVid_Android_sorgenti.zip.sha256 notes.md; do
            curl --fail --location --retry 3 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/release-2.8.0/$file" --output "$file"
          done
          sha256sum -c VibraVid_Studio_Android.apk.sha256
          sha256sum -c VibraVid_Android_sorgenti.zip.sha256
          gh release create v2.8.0-android --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VibraVid Android 2.8.0" --notes-file notes.md --latest VibraVid_Studio_Android.apk VibraVid_Android_sorgenti.zip VibraVid_Studio_Android.apk.sha256 VibraVid_Android_sorgenti.zip.sha256
