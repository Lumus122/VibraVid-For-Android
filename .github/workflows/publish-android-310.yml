name: Publish signed Android release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-310.yml']
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Publish Android 3.1.0 release assets'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,time
          files=json.loads('[{"name":"VibraVid_Studio_Android.apk","sha256":"b0faaefb43355f2a98f249282ae60a2e074924d09dfebcfc6bb105f6769dc20a","parts":["b4c56c591a287cb7cf97feda97ce369bcb3633b2","7fa70eee64039c713e6a145e8cfc60f056eb4c12","2659c205738578126239d776b8845039bd1d1253","6668da9db862a11c2f2828864947ce894ff89252","53712b782e7ebd7315bfca48e3d1a6705f53280f","81f022519ebbd5ce28b1b7299dfaacceaac73a31","34ddf647efa0ce104b58b50474edb1a5990f3fb7","ce97bde355b30ec5cb57c70a8a550fd4c1d729de","dc035ac50faae1acd62e216fe3383adbff5d9337"]},{"name":"VibraVid_Android_sorgenti.zip","sha256":"8cf2303a4fd7565dde500625acc979a63cc9251fdd8257e7ef3ad070d5954994","parts":["04f9d821edcec41cb5125fdd56b9674928202018","3ea75888a9d2b8ddf4c291c81a05604c0e728f63","92c2022730965343ba9850ef8d33f1d795ef7d8c","adb92170bd7e8806a85e9ec52c9a66464293a088","2e563b4060f98de164380d88f29b1d93e64b72d3","09e6bcd1ffa31eaaf1c2e79e900fdf666bc66d41"]},{"name":"VibraVid_Studio_Android.apk.sha256","sha256":"84883f633879121f36a1af5fc990ba5c386ba813d0c43e3a744b92deecdf0c56","parts":["bb8d1b0c311797d61b1d5ac0fb9b30011eea7a37"]},{"name":"VibraVid_Android_sorgenti.zip.sha256","sha256":"ca1b8066d9deeb90af94eda5ef95f84b00fad7e43bd26a521095bf9a8194b6ce","parts":["76e227766e8fcdb8112f873a6f8e760e1c710ea6"]},{"name":"VERIFICA_11_PUNTI.md","sha256":"72ed71cd17b81236b1830283bfa7a5899e4e95567c65defada8d9e86dbefc2b0","parts":["a7ce1a6d95afa001d61a8b7c04bf2c873a227e33"]},{"name":"notes.md","sha256":"b001e84e3e355c4ce6736836cd1702738b9a9b6487a60e27c35fa27950600d1f","parts":["3bca5d61a4a7e33ffa29f6f8a2a52438f6af64c2"]}]')
          repo=os.environ['GITHUB_REPOSITORY']
          pathlib.Path('package').mkdir(exist_ok=True)
          os.chdir('package')
          for item in files:
              with open(item['name'],'wb') as output:
                  for blob in item['parts']:
                      for attempt in range(5):
                          try:
                              encoded=subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{blob}','--jq','.content'])
                              output.write(base64.b64decode(encoded))
                              break
                          except subprocess.CalledProcessError:
                              if attempt==4:raise
                              time.sleep(3*(attempt+1))
              actual=hashlib.sha256(pathlib.Path(item['name']).read_bytes()).hexdigest()
              if actual!=item['sha256']:raise SystemExit('Checksum mismatch: '+item['name'])
              print('Verified '+item['name']+': '+actual,flush=True)
          subprocess.run(['gh','release','create','v3.1.0-android','--repo',repo,'--target','11ac42c366a054c77b3362167e4d1f825f249798','--title','VibraVid Android 3.1.0','--notes-file','notes.md','--latest',*[item['name'] for item in files if item['name']!='notes.md']],check=True)
          PY

